# The counts endpoint (V7). Deploy: see README.md in this folder.
name = "upgraditch-counts"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# B4 spec: keep request logging off. No Workers Logs, no traces, no Logpush.
logpush = false

[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "upgraditch-counts"
database_id = "67340c21-53d6-4ae0-8e1a-f9d7e2434eed"

# Uploads per IP address per minute, counted per Cloudflare location. The address is only the
# limiter's key; the Worker never stores it. An install uploads at most once an hour.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 2, period = 60 }

[vars]
# Optional: the Chrome Web Store build's origin, e.g. "chrome-extension://abcdefghijklmnopabcdefghijklmnop".
# Empty allows any Chrome extension origin. Firefox origins are random per install and always allowed.
ALLOWED_ORIGINS = ""
# Events stored per UTC day over all installs. Each event writes a few D1 rows (the table and
# its indexes), so keep this well under the plan's daily row-write limit.
MAX_EVENTS_PER_DAY = "10000"
